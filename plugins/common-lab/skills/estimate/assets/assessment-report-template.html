}.target-grid section{border:1px solid var(--rule);padding:14px;min-width:0}.target-grid h5{font-size:14px;margin-bottom:10px}.target-grid ul{padding-left:18px;margin:0;overflow-wrap:anywhere}.target-grid li+li{margin-top:4px}.empty{color:var(--muted);margin:0}.target-note{margin:10px 0 0;padding:11px 14px;background:#fff8e6;border-left:4px solid var(--baseline)}.work-math{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border:1px solid var(--rule)}.work-math div{display:grid;padding:12px}.work-math div+div{border-left:1px solid var(--rule)}.work-math span{font-size:12px;color:var(--muted)}.work-math strong{font:700 16px 'Cascadia Mono','Consolas',monospace}.work-math .baseline{background:var(--focus-soft);border-top:3px solid var(--focus);padding-top:9px}.baseline-rationale{margin:0;padding:15px 16px;background:var(--focus-soft);border-left:4px solid var(--focus)}.effort-split{margin:8px 0 0;color:var(--muted);font-size:13px}.tier-guide{margin:0}.tier-guide div{display:grid;grid-template-columns:140px 1fr;gap:16px;padding:13px 0;border-top:1px solid var(--rule)}.tier-guide dt{font-weight:800}.tier-guide dd{margin:0}.dialog-footer{display:flex;justify-content:flex-end;padding:14px 26px;background:var(--surface);border-top:1px solid var(--rule)}.return-button{min-width:200px;padding:11px 18px;background:var(--ink);border:1px solid var(--ink);color:#fff;font-weight:800;cursor:pointer}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.package-row{transition:none}}
@media(max-width:760px){main{padding:26px 14px 60px}.report-header{display:block}.report-header>p:last-child{margin-top:12px}.summary-panel{grid-template-columns:1fr}.summary-main{padding:26px 20px}.current-state{font-size:18px}.summary-facts{grid-template-columns:1fr}.total-ledger{padding:22px 18px}.section-heading.primary{grid-template-columns:1fr;gap:6px}.package-columns{display:none}.package-row{grid-template-columns:28px minmax(0,1fr) repeat(3,54px);padding:14px 10px;gap:5px}.package-copy{grid-column:2/-1;padding:0 0 7px}.package-copy strong{font-size:17px}.package-rank{grid-row:1/3}.estimate{height:48px}.estimate b{font-size:21px}.open-cue{grid-column:2/-1;text-align:left;padding-top:4px}.package-dialog{width:100%;height:100dvh}.dialog-header{padding:16px}.dialog-header h2{font-size:28px}.dialog-scroll{padding:20px 16px 34px}.effort-ledger{grid-template-columns:1fr 1fr}.effort-ledger div:nth-child(3){border-left:0;border-top:1px solid var(--rule)}.effort-ledger div:nth-child(4){border-top:1px solid var(--rule)}.package-intro,.target-grid{grid-template-columns:1fr}.work-math{grid-template-columns:1fr}.work-math div+div{border-left:0;border-top:1px solid var(--rule)}.tier-guide div{grid-template-columns:1fr;gap:2px}.dialog-footer{padding:12px 16px}.return-button{width:100%}.explanation-figure{overflow-x:auto}.explanation-visual{min-width:520px}}

  <style>

@media(max-width:760px){.workset>summary{padding:12px}.workset-body{padding:12px}.workset-table-scroll{margin-right:-12px}.generation-method div{grid-template-columns:1fr;gap:2px}}
  </style>
</head>
<body>
<main>
$body
</main>
<script>
(() => {
  let opener = null;
  let savedScrollY = 0;

  const closeDialog = (dialog) => {
    if (dialog && dialog.open) dialog.close();
  };

  document.querySelectorAll('[data-dialog]').forEach((button) => {
    button.addEventListener('click', () => {
      const dialog = document.getElementById(button.dataset.dialog);
      if (!dialog || typeof dialog.showModal !== 'function') return;
      opener = button;
      savedScrollY = window.scrollY;
      dialog.showModal();
      const scroller = dialog.querySelector('.dialog-scroll');
      if (scroller) scroller.scrollTop = 0;
      dialog.querySelector('[data-close]')?.focus({preventScroll: true});
    });
  });

  document.querySelectorAll('.package-dialog').forEach((dialog) => {
    dialog.querySelectorAll('[data-close]').forEach((button) => {
      button.addEventListener('click', () => closeDialog(dialog));
    });
    dialog.addEventListener('click', (event) => {
      // Keyboard activation has no pointer position; descendants are not the backdrop.
      if (event.target !== dialog || event.detail === 0) return;
      const box = dialog.getBoundingClientRect();
      const outside = event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom;
      if (outside) closeDialog(dialog);
    });
    dialog.addEventListener('close', () => {
      window.scrollTo({top: savedScrollY, behavior: 'instant'});
      opener?.focus({preventScroll: true});
      opener = null;
    });
  });
})();
</script>
</body>
